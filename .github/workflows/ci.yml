name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Gate self-proof — gitleaks canary (ADR 0009)
        # 门禁必须自证会红：先用随机假 GitHub token 喂给同版本 gitleaks，扫不出=扫描器坏了=
        # 下面这道密钥门是假绿。一道从未失败过的门禁与一道不存在的门禁在证据上无法区分。
        run: |
          set -euo pipefail
          ver=8.30.1
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"; arch="$(uname -m)"
          case "${os}/${arch}" in
            linux/x86_64)  asset=linux_x64;   sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            linux/aarch64) asset=linux_arm64;  sha=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            darwin/arm64)  asset=darwin_arm64; sha=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            darwin/x86_64) asset=darwin_x64;   sha=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709 ;;
            *) echo "::error title=canary::unsupported runner platform ${os}/${arch}"; exit 1 ;;
          esac
          tmp="$(mktemp -d)"; trap 'rm -rf "${tmp}"' EXIT
          # 随机假 token 放在仓库树外，不污染下面的真实扫描
          printf 'github_token = ghp_%s\n' "$(LC_ALL=C tr -dc 'a-zA-Z0-9' </dev/urandom | head -c 36)" > "${tmp}/planted.txt"
          curl -fsSL --retry 3 -o "${tmp}/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_${asset}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then echo "${sha}  ${tmp}/gl.tgz" | sha256sum -c -; else echo "${sha}  ${tmp}/gl.tgz" | shasum -a 256 -c -; fi
          tar -xzf "${tmp}/gl.tgz" -C "${tmp}" gitleaks
          if "${tmp}/gitleaks" detect --no-git --source "${tmp}" --log-level error; then
            echo "::error title=Gate self-proof failed::gitleaks 未标记植入的假密钥——扫描器已损坏，下面的真实扫描是假绿" >&2
            exit 1
          fi
          echo "✓ 金丝雀通过：扫描器成功标记了植入的假密钥，真实扫描可信"
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  validate:
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate shell syntax
        run: |
          bash -n \
            install.sh \
            skills/vibedevops/scripts/deploy-handoff.sh \
            skills/vibedevops/scripts/health-check.sh \
            skills/vibedevops/scripts/test-health-check.sh \
            skills/vibedevops/scripts/test-build-runner.sh \
            skills/vibedevops/scripts/test-container-build.sh \
            skills/vibedevops/scripts/test-image-lifecycle.sh \
            skills/vibedevops/scripts/test-install.sh \
            skills/vibedevops/scripts/test-reasonix-runtime.sh \
            skills/vibedevops/templates/build-gate/install-github-runner.sh \
            skills/vibedevops/templates/build-gate/onboard-reconcile.sh \
            skills/vibedevops/templates/verification/verify-web.sh \
            skills/vibedevops/templates/verification/capture-trace.sh \
            skills/vibedevops/templates/verification/check-feature-map.sh \
            skills/vibedevops/templates/ci/automerge-tiers.sh \
            skills/vibedevops/templates/build-gate/onboard-repo.sh \
            skills/vibedevops/templates/ci/runner-failover.sh \
            skills/vibedevops/templates/ci/cd-lane.sh \
            skills/vibedevops/templates/build-gate/net-adaptive.sh \
            skills/vibedevops/templates/build-gate/warm-base-images.sh \
            skills/vibedevops/templates/build-gate/build-container-image.sh \
            skills/vibedevops/templates/reasonix-runtime/health-check.sh \
            skills/vibedevops/templates/reasonix-runtime/install.sh \
            skills/vibedevops/templates/image-lifecycle/cleanup-docker-images.sh \
            skills/vibedevops/templates/image-lifecycle/cleanup-ghcr-versions.sh \
            skills/vibedevops/templates/image-lifecycle/install-local-guard.sh \
            skills/vibedevops/scripts/check-adr-compliance.sh \
            skills/vibedevops/scripts/test-adr-compliance.sh \
            skills/vibedevops/scripts/check-runtime-drift.sh \
            docs/adr/checks/0006-runner-routing.sh \
            docs/adr/checks/0009-gate-canary.sh \
            docs/adr/checks/0009-no-silent-skip.sh \
            docs/adr/checks/0012-wired-in-ci.sh
      - name: ADR↔templates 机械对账 (ADR 0012)
        run: ./skills/vibedevops/scripts/check-adr-compliance.sh
      - name: Test ADR compliance guardrails
        run: ./skills/vibedevops/scripts/test-adr-compliance.sh
      - name: Test CI/CD scoring
        run: ./skills/vibedevops/scripts/test-health-check.sh
      - name: Test global rule installation
        run: ./skills/vibedevops/scripts/test-install.sh
      - name: Test self-hosted runner installer guardrails
        run: ./skills/vibedevops/scripts/test-build-runner.sh
      - name: Test repo onboarding reconcile guardrails
        run: ./skills/vibedevops/scripts/test-onboard.sh
      - name: Test verification autonomy guardrails
        run: ./skills/vibedevops/scripts/test-verification.sh
      - name: Test container build mirror fallback
        run: ./skills/vibedevops/scripts/test-container-build.sh
      - name: Test image lifecycle guardrails
        run: ./skills/vibedevops/scripts/test-image-lifecycle.sh
      - name: Download pinned Reasonix v1.21.5
        run: |
          mkdir -p /tmp/reasonix-v1.21.5
          curl -fsSL \
            https://github.com/esengine/DeepSeek-Reasonix/releases/download/v1.21.5/reasonix-linux-amd64.tar.gz \
            -o /tmp/reasonix-v1.21.5/reasonix-linux-amd64.tar.gz
          echo "619123fa87320a7357e24ec0f8d5ab5fc7ecc87dc6c09365036540e94281cae8  /tmp/reasonix-v1.21.5/reasonix-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf /tmp/reasonix-v1.21.5/reasonix-linux-amd64.tar.gz -C /tmp/reasonix-v1.21.5
          /tmp/reasonix-v1.21.5/reasonix --version
      - name: Test Reasonix runtime installation
        env:
          VIBEDEVOPS_REASONIX_REAL_BIN: /tmp/reasonix-v1.21.5/reasonix
        run: ./skills/vibedevops/scripts/test-reasonix-runtime.sh
      - name: Build and smoke-test container image
        run: |
          ./skills/vibedevops/templates/build-gate/build-container-image.sh \
            --tag vibedevops-skill:ci \
            --timeout-seconds 300 \
            --route \
              "public.ecr.aws/docker/library/alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce" \
              "https://dl-cdn.alpinelinux.org/alpine"
          container_id="$(docker run --detach --publish 127.0.0.1::8080 vibedevops-skill:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            [ "$status" != "healthy" ] || break
            [ "$status" != "unhealthy" ] || exit 1
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy
          test "$(docker exec "$container_id" id -u)" != 0
      - name: Run repository health check
        run: ./skills/vibedevops/scripts/health-check.sh --json .

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets, validate]
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      created: ${{ steps.publish.outputs.created }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_sha: ${{ steps.metadata.outputs.release_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate release metadata
        id: metadata
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          grep -q "^## ${tag} — " CHANGELOG.md
          awk -v header="## ${tag} — " '
            index($0, header) == 1 { capture=1; next }
            capture && /^## v/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git log -1 --format=%H -- VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publish immutable GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SHA: ${{ steps.metadata.outputs.release_sha }}
        run: |
          echo "created=false" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            actual_sha="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk '
              /\^\{\}$/ { peeled=$1 }
              !/\^\{\}$/ { direct=$1 }
              END { print peeled ? peeled : direct }
            ')"
            test "$actual_sha" = "$RELEASE_SHA"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG exists without a GitHub Release; refusing to retarget it" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Verify release target
        if: steps.publish.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SHA: ${{ steps.metadata.outputs.release_sha }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          for attempt in $(seq 1 10); do
            actual_sha="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk '
              /\^\{\}$/ { peeled=$1 }
              !/\^\{\}$/ { direct=$1 }
              END { print peeled ? peeled : direct }
            ')"
            [ "$actual_sha" != "$RELEASE_SHA" ] || exit 0
            sleep 2
          done
          echo "release tag $TAG did not resolve to $RELEASE_SHA" >&2
          exit 1

  rollback_release:
    if: always() && needs.release.result == 'failure' && needs.release.outputs.created == 'true'
    needs: release
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Roll back failed release publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
