name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate shell syntax
        run: |
          bash -n \
            install.sh \
            skills/vibedevops/scripts/deploy-handoff.sh \
            skills/vibedevops/scripts/health-check.sh \
            skills/vibedevops/scripts/test-health-check.sh \
            skills/vibedevops/scripts/test-install.sh
      - name: Test CI/CD scoring
        run: ./skills/vibedevops/scripts/test-health-check.sh
      - name: Test global rule installation
        run: ./skills/vibedevops/scripts/test-install.sh
      - name: Run repository health check
        run: ./skills/vibedevops/scripts/health-check.sh --json .
